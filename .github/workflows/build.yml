name: Build and test LiteraHub
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore LiteraHub.slnx
      - name: Build
        run: dotnet build LiteraHub.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test LiteraHub.Tests/LiteraHub.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=results.trx" --results-directory TestResults
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
